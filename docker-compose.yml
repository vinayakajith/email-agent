services:
  db:
    image: paradedb/paradedb:latest-pg17
    environment:
      POSTGRES_USER: email_agent
      POSTGRES_PASSWORD: email_agent
      POSTGRES_DB: email_agent
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_agent"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
